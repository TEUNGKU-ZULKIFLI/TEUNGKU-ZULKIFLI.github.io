<!-- Halaman Resume - Struktur Dokumen A4 Terstandarisasi -->
<div class="resume-wrapper">
    
    <!-- Panel Aksi Pengendali (Hanya terlihat di browser, tidak ikut dicetak) -->
    <div class="no-print resume-actions-panel">
        <p>Gunakan opsi di samping untuk mencetak atau menyimpan dokumen ini sebagai berkas PDF resmi.</p>
        <button onclick="window.print()" class="btn-print-action">
            🖨️ Cetak / Simpan PDF
        </button>
    </div>

    <!-- Simulasi Kertas Dokumen Fisik A4 -->
    <div class="cv-document">
        <header class="cv-header">
            <h1 id="cv-nama" class="cv-name"></h1>
            <p id="cv-kontak" class="cv-contact-info"></p>
            <a id="cv-tautan" href="#" target="_blank" class="cv-link"></a>
        </header>

        <!-- Ringkasan Profesional -->
        <section class="cv-section">
            <h2 class="cv-section-title">Profil Profesional</h2>
            <p id="cv-profil" class="cv-p"></p>
        </section>

        <!-- Riwayat Pekerjaan -->
        <section class="cv-section">
            <h2 class="cv-section-title">Pengalaman Kerja</h2>
            <div id="cv-pengalaman" class="cv-items-container">
                <!-- Data dari resume_idn.json disuntikkan ke sini -->
            </div>
        </section>

        <!-- Riwayat Pendidikan -->
        <section class="cv-section">
            <h2 class="cv-section-title">Pendidikan</h2>
            <div id="cv-pendidikan" class="cv-items-container">
                <!-- Data dari resume_idn.json disuntikkan ke sini -->
            </div>
        </section>

        <!-- Proyek Teknis Pilihan -->
        <section class="cv-section">
            <h2 class="cv-section-title">Proyek Teknis</h2>
            <div id="cv-proyek" class="cv-items-container">
                <!-- Data dari resume_idn.json disuntikkan ke sini -->
            </div>
        </section>

        <!-- Kelompok Keahlian Komparatif -->
        <section class="cv-section">
            <h2 class="cv-section-title">Keahlian & Kompetensi</h2>
            <div class="cv-skills-grid">
                <div class="cv-skill-col">
                    <strong>Administrasi Jaringan & Server:</strong>
                    <span id="cv-skill-jaringan"></span>
                </div>
                <div class="cv-skill-col">
                    <strong>Pengembangan Perangkat Lunak:</strong>
                    <span id="cv-skill-dev"></span>
                </div>
                <div class="cv-skill-col">
                    <strong>Bahasa:</strong>
                    <span id="cv-bahasa"></span>
                </div>
            </div>
        </section>
    </div>

</div>
