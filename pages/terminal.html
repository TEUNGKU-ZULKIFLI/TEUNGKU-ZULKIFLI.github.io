<!-- ========================================================================
   MODUL TEMPLATE: TERMINAL (pages/terminal.html)
   Struktur semantik murni dengan penamaan kelas 'terminal-' yang konsisten.
======================================================================== */ -->
<div class="terminal-page-wrapper">
    
    <!-- Header Pembuka Halaman -->
    <div class="terminal-page-header">
        <h2 class="terminal-page-title">Konsol Terminal Interaktif</h2>
        <p class="terminal-page-subtitle">Jelajahi resume dan spesifikasi sistem saya menggunakan antarmuka baris perintah retro.</p>
    </div>

    <!-- Kotak Simulator Konsol Terminal -->
    <div class="terminal-box-container">
        <!-- Bilah Atas Konsol -->
        <div class="terminal-box-header">
            <div class="terminal-box-buttons">
                <span class="terminal-box-dot terminal-close"></span>
                <span class="terminal-box-dot terminal-minimize"></span>
                <span class="terminal-box-dot terminal-expand"></span>
            </div>
            <div class="terminal-box-title">teungku@server:~</div>
        </div>
        
        <!-- Log Layar & Input Area -->
        <div id="terminal-screen" class="terminal-box-body">
            <div class="terminal-log-output">
                <p class="terminal-welcome-text">Selamat datang di Server Teungku OS v2.5!</p>
                <p class="terminal-hint-text">Ketik <span class="terminal-command-highlight">help</span> untuk melihat daftar perintah yang tersedia.</p>
                <p>&nbsp;</p>
            </div>
            
            <!-- Baris Input Prompt Dinamis -->
            <div class="terminal-input-row">
                <span class="terminal-prompt-text">teungku@server:~$</span>
                <input type="text" id="terminal-command-input" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>

</div>
