<div class="blog-container">
    
    <!-- Sidebar Navigasi Kategori (Koleksi Artikel) -->
    <aside id="blog-sidebar" class="blog-sidebar">
        <div class="blog-sidebar-header">
            <h3 class="blog-sidebar-title">Koleksi Catatan</h3>
            <p class="blog-sidebar-desc">Pilih dokumentasi, lab jaringan, atau catatan teknis di bawah ini:</p>
        </div>
        <nav id="blog-navigation" class="blog-navigation-menu">
            <p class="blog-loading-text">Memuat daftar topik...</p>
        </nav>
    </aside>

    <!-- Area Layar Pembaca Artikel Utama -->
    <main id="blog-reader" class="blog-reader-area">
        <!-- Tombol Kembali Ke Daftar (Hanya Terlihat di Mobile Saat Membaca) -->
        <div id="blog-back-container" class="blog-back-bar no-print" style="display: none;">
            <button id="blog-btn-back" class="blog-back-btn">
                &larr; Kembali ke Daftar Artikel
            </button>
        </div>

        <!-- Wadah Konten Markdown yang Sudah Ter-render -->
        <div id="blog-content" class="markdown-body">
            <div class="blog-welcome-state">
                <span class="blog-welcome-icon">📖</span>
                <h3 class="blog-welcome-title">Pusat Pembelajaran Mandiri</h3>
                <p class="blog-welcome-desc">Silakan pilih salah satu artikel di panel sebelah kiri untuk mulai membaca praktikum sistem, lab jaringan, atau catatan perjalanan karir saya.</p>
            </div>
        </div>
    </main>

</div>
