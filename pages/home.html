<!-- ========================================================================
   MODUL TEMPLATE: HOME (pages/home.html)
   Struktur semantik murni dengan penamaan kelas 'home-' yang konsisten.
======================================================================== */ -->
<div class="home-container">
    
    <!-- Area Gambar Profil (Foto Asli + Lengan Kartun Berotot) -->
    <div class="home-avatar-section">
        <div class="home-avatar-canvas">
            <svg class="home-avatar-svg" viewBox="0 0 150 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Clip path untuk memotong foto 1:1 secara otomatis -->
                    <clipPath id="home-photo-clip">
                        <rect x="35" y="20" width="80" height="80" rx="16" ry="16" />
                    </clipPath>
                </defs>

                <!-- 1. Bayangan Bingkai -->
                <rect x="38" y="23" width="80" height="80" rx="16" ry="16" fill="var(--bg-tertiary)" opacity="0.6" />

                <!-- 2. Foto Formal Asli (Diambil dari ./assets/profile.jpg) -->
                <image href="./assets/profile.jpg" 
                       x="35" y="20" width="80" height="80" 
                       clip-path="url(#home-photo-clip)"
                       preserveAspectRatio="xMidYMid slice" />

                <!-- 3. Bingkai Border -->
                <rect x="35" y="20" width="80" height="80" rx="16" ry="16" fill="none" stroke="var(--border-color)" stroke-width="2.5" />

                <!-- 4. Lengan Kartun Kanan Berotot (Pas Bahu) -->
                <g class="home-arm-wave">
                    <!-- Lengan baju / sleeve -->
                    <path d="M 114,72 
                             C 122,70 128,76 126,88 
                             C 124,96 118,98 114,94 Z" 
                          fill="var(--accent)" stroke="var(--border-color)" stroke-width="2.5" />
                    
                    <!-- Otot Bisep & Forearm Vektor -->
                    <path d="M 116,84 
                             C 128,88 138,76 136,62 
                             C 134,54 144,40 139,30 
                             C 133,20 123,28 121,38 
                             C 118,48 110,58 114,68" 
                          fill="#fbcfe8" stroke="var(--border-color)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                    
                    <!-- Kepalan Tangan Kartun -->
                    <circle cx="140" cy="30" r="12" fill="#fbcfe8" stroke="black" stroke-width="2.5"/>
                    <text x="130" y="34" text-anchor="middle" font-size="50" transform="scale(-1,1) translate(-280,0)">👋🏻</text>
                    
                    <!-- Guratan Otot Bisep -->
                    <path d="M 124,56 Q 128,53 129,59" fill="none" stroke="var(--border-color)" stroke-width="2" stroke-linecap="round"/>
                </g>
            </svg>
        </div>
    </div>

    <!-- Area Teks & Identitas Utama -->
    <div class="home-text-section">
        <h1 id="home-name" class="home-title"></h1>
        <h2 id="home-role" class="home-subtitle"></h2>
        <p id="home-tagline" class="home-desc"></p>

        <!-- Tombol Panggilan Aksi (Call to Action) -->
        <div class="home-actions">
            <a href="#resume" class="home-btn-primary">Download CV (IDN)</a>
            <a href="#terminal" class="home-btn-secondary">⚡ Buka Terminal CLI</a>
        </div>
    </div>

</div>
